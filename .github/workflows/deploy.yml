name: Deploy Render

# Pipeline de producao: so deploya se build + testes passarem.
# autoDeploy esta desligado no render.yaml, entao este workflow e o unico gatilho.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build e testes
        run: ./mvnw -B clean verify

      - name: Publicar relatorio de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Validar build da imagem Docker
        run: docker build -t senac-api:${{ github.sha }} .

  deploy:
    name: Deploy no Render
    needs: build-test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.RENDER_SERVICE_URL }}
    steps:
      - name: Disparar deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOOK}" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL nao configurado."
            exit 1
          fi
          # O Render monta a imagem a partir do commit mais recente da branch
          # conectada ao servico; o hook so enfileira o deploy.
          status=$(curl -sS -o response.txt -w '%{http_code}' -X POST "${DEPLOY_HOOK}")
          echo "HTTP ${status}"
          cat response.txt
          if [ "${status}" -ge 300 ]; then
            echo "::error::Deploy hook retornou HTTP ${status}"
            exit 1
          fi

      - name: Aguardar servico ficar saudavel
        if: vars.RENDER_SERVICE_URL != ''
        env:
          SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          set -uo pipefail
          health="${SERVICE_URL%/}/actuator/health"
          echo "Verificando ${health}"
          # Da tempo do Render derrubar a instancia antiga antes de medir,
          # senao o health da versao anterior passa como se fosse a nova.
          sleep 45
          # Plano free demora para subir: 40 tentativas x 15s = ate 10 minutos.
          for i in $(seq 1 40); do
            body=$(curl -sS --max-time 20 "${health}" || true)
            echo "tentativa ${i}: ${body:-sem resposta}"
            case "${body}" in
              *'"status":"UP"'*)
                echo "Servico no ar."
                exit 0
                ;;
            esac
            sleep 15
          done
          echo "::error::Servico nao respondeu UP em /actuator/health dentro do tempo limite."
          exit 1
