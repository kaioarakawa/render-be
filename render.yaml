# Blueprint do Render: cria banco + serviço web a partir do repositório.
# Render Dashboard -> New -> Blueprint -> aponte para este repositório.

databases:
  - name: senac-db
    databaseName: senac
    user: senac
    plan: free
    region: oregon

services:
  - type: web
    name: senac-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: PGHOST
        fromDatabase:
          name: senac-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: senac-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: senac-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: senac-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: senac-db
          property: password
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75.0
